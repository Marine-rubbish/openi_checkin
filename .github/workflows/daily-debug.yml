name: Daily Debug

on:
  schedule:
    # 每天 12:00 UTC 触发（请根据你需要的本地时间换算）
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  run-debug:
    runs-on: ubuntu-latest
    env:
        USER_NAME: ${{ vars.USER_NAME }}        # 你的账户名称
        PASS_WORD: ${{ vars.PASS_WORD }}        # 你的账户密码
        REPO_NAME: ${{ vars.REPO_NAME }}        # 云脑环境对应的项目名称
        COOKIE: ${{ secrets.OPENI_COOKIE }}     # 你的cookie
        BRIEF_COUNT: 50                         # 发送 brief 的次数，按需修改
        BRIEF_INTERVAL: 10                      # 间隔秒数
    steps:
      # 检出仓库内文件
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix script permissions
        run: |
          chmod +x scripts/*.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          # 确保依赖存在
          if ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else exit 1; fi
            fi
            # 兼容老镜像
            if grep -q "buster" /etc/os-release 2>/dev/null; then
              $SUDO sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
              $SUDO sed -i 's/security.debian.org/archive.debian.org/g' /etc/apt/sources.list
              $SUDO sed -i '/stretch-updates/d' /etc/apt/sources.list
            fi
            $SUDO apt-get update
            $SUDO apt-get install -y jq curl ca-certificates
          fi

      - name: Check Cookie Validity (Ensure Auth & CSRF)
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. 尝试从当前 COOKIE 提取 CSRF 进行一次轻量级请求验证
          CSRF=$(echo "$COOKIE" | grep -o '_csrf=[^;]*' | sed 's/_csrf=//' || echo "")
          
          HTTP_CODE=0
          if [ -n "$CSRF" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Cookie: $COOKIE" \
                "https://openi.pcl.ac.cn/api/v1/ai_task/my_list?pageSize=1&_csrf=${CSRF}")
          fi

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Cookie 或 CSRF 无效 (HTTP $HTTP_CODE)，启动自动登录续期..."
            ./scripts/login.sh "$USER_NAME" "$PASS_WORD"
            
            # 使用 login.sh 产生的 cookies.txt 更新 COOKIE 变量
            export OPENI_COOKIE="$COOKIE"
            UPDATED_COOKIE=$(./scripts/replace_csrf.sh)
            
            # 将新 Cookie 注入环境，供后面所有步骤使用
            echo "COOKIE=${UPDATED_COOKIE}" >> $GITHUB_ENV
            echo "Cookie 已更新并写入环境"
          else
            echo "当前 Cookie 和 CSRF 校验通过 (HTTP 200)"
            echo "COOKIE=${COOKIE}" >> $GITHUB_ENV
          fi

      - name: Get JOB_ID
        shell: bash
        run: |
          set -euo pipefail

          # 此时提取的一定是有效的（或者是刚好更新过的）
          CSRF=$(echo "$COOKIE" | grep -o '_csrf=[^;]*' | sed 's/_csrf=//' || echo "")
          url="https://openi.pcl.ac.cn/api/v1/ai_task/my_list?page=1&pageSize=30&_csrf=${CSRF}"
          echo "Requesting: $url"

          resp="$(
            curl --fail --show-error --silent \
              --retry 5 --retry-delay 2 \
              --connect-timeout 20 --max-time 60 \
              --tlsv1.2 \
              -G "$url" \
              -H "Cookie: $COOKIE"
          )"

          # 校验返回结构
          echo "$resp" | jq -e '.data.tasks' >/dev/null

          # 筛选当前项目的任务 ID
          JOB_ID=$(echo "$resp" | jq -r --arg REPO "$REPO_NAME" '.data.tasks | map(select(.repo_name == $REPO or .task.repo_name == $REPO)) | map(.task.id // .id) | max')

          if [[ -z "${JOB_ID}" || "${JOB_ID}" == "null" ]]; then
            echo "未在响应中找到项目 ${REPO_NAME} 的任务，响应如下："
            echo "$resp" | jq .
            exit 1
          fi

          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "项目 ${REPO_NAME} 的最大 task id: ${JOB_ID}"
      - name: Start debug job
        run: |
          set -e
          ./scripts/action.sh restart "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
          # 确保一定是在RUNNING状态
          # for i in $(seq 1 "${BRIEF_COUNT}"); do
          #     echo "第 ${i} 次发送 brief"
          #     action brief "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
          #     echo "task status: $status"
          #     if [ "$status" = "RUNNING" ]; then
          #         echo "任务已启动，状态为 RUNNING"
          #         break
          #     fi
          #     sleep "${BRIEF_INTERVAL}"
          # done
          sleep 100
            
      - name: Get New JOB_ID after restart
        shell: bash
        run: |
          set -euo pipefail
          
          # 同样逻辑，提取 CSRF
          CSRF=$(echo "$COOKIE" | grep -o '_csrf=[^;]*' | sed 's/_csrf=//' || echo "")
          url="https://openi.pcl.ac.cn/api/v1/ai_task/my_list?page=1&pageSize=30&_csrf=${CSRF}"
          
          # 获取列表，并添加一些 Header 模拟
          resp="$(
            curl --fail --show-error --silent \
              --retry 5 --retry-delay 2 \
              --connect-timeout 20 --max-time 60 \
              --tlsv1.2 \
              -H "Cookie: $COOKIE" \
              -H 'accept: application/json, text/plain, */*' \
              "$url"
          )"

          # 校验并提取当前项目【状态为 RUNNING】或者【最新创建】的任务 ID
          # 重启后会生成一个全新的任务 ID，我们取对应项目的 max id
          JOB_ID=$(echo "$resp" | jq -r --arg REPO "$REPO_NAME" '.data.tasks | map(select(.repo_name == $REPO or .task.repo_name == $REPO)) | map(.task.id // .id) | max')

          if [[ -z "${JOB_ID}" || "${JOB_ID}" == "null" ]]; then
            echo "重启后未找到项目 ${REPO_NAME} 的新 JOB_ID"
            echo "Response: $resp"
            exit 1
          fi

          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "重启后的最新 task id: ${JOB_ID}"
      - name: Stop debug job
        run: |
            CSRF=$(echo "$COOKIE" | grep -o '_csrf=[^;]*' | sed 's/_csrf=//' || echo "")
            # 修正 URL：必须带上 _csrf
            STATUS=$(curl -s -G "https://openi.pcl.ac.cn/api/v1/ai_task/my_list?page=1&pageSize=10&_csrf=${CSRF}" \
              -H "Cookie: $COOKIE" | jq -r --arg ID "$JOB_ID" '.data.tasks[] | select((.id|tostring) == $ID or (.task.id|tostring) == $ID) | .status // .task.status')
            echo "Task $JOB_ID status: $STATUS"
            if [ "$STATUS" != "RUNNING" ]; then
              echo "Error: Task not RUNNING, cannot stop."
              exit 1
            fi
            ./scripts/action.sh stop "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
