name: Daily Debug

on:
  schedule:
    # 每天 12:00 UTC 触发（请根据你需要的本地时间换算）
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  run-debug:
    runs-on: ubuntu-latest
    env:
        USER_NAME: ${{ vars.USER_NAME }}        # 你的账户名称
        PASS_WORD: ${{ vars.PASS_WORD }}        # 你的账户密码
        REPO_NAME: ${{ vars.REPO_NAME }}        # 云脑环境对应的项目名称
        COOKIE: ${{ secrets.OPENI_COOKIE }}     # 你的cookie
        BRIEF_COUNT: 50                         # 发送 brief 的次数，按需修改
        BRIEF_INTERVAL: 10                      # 间隔秒数
    steps:
      # 检出仓库内文件
      - name: Checkout repo
        uses: actions/checkout@v6

      # - name: Install dependencies
      #   run: |
      #     # sudo apt-get update
      #     apt-get install -y jq

      - name: Get JOB_ID
        # 字面块标量（保留换行）
        run: |
            set -euo pipefail
            JOB_ID=$(curl -s -G "https://openi.pcl.ac.cn/api/v1/${USER_NAME}/${REPO_NAME}/ai_task/list" \
                -H "Cookie: $COOKIE" \
            | jq '.data.tasks | map(.task.id) | max')
            echo "JOB_ID=${JOB_ID}" >> $GITHUB_ENV
            echo "最大 task id: ${JOB_ID}"
            chmod +x ./scripts/action.sh ./scripts/replace_csrf.sh ./scripts/login.sh
      - name: Check Cookie Validity
        run: |
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Cookie: ${{ secrets.OPENI_COOKIE }}" \
                "https://openi.pcl.ac.cn/api/v1/${{ vars.USER_NAME }}/${{ vars.REPO_NAME }}/ai_task/list")
            if [ "$HTTP_CODE" -ne 200 ]; then
                echo "Cookie 过期，需重新登录"
                ./scripts/login.sh "$USER_NAME" "$PASS_WORD"
                # 从 secrets 初始化 COOKIE（如果 secrets 过期，用 login.sh 更新）
                export COOKIE="${{ secrets.OPENI_COOKIE }}"
                # 然后用 replace_csrf.sh 更新其中的 _csrf 和 i_like_openi
                export COOKIE=$(./scripts/replace_csrf.sh)
                echo "COOKIE=${COOKIE}" >> $GITHUB_ENV
            fi
      - name: Start debug job
        run: |
            set -e
            ./scripts/action.sh restart "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
            # 确保一定是在RUNNING状态
            # for i in $(seq 1 "${BRIEF_COUNT}"); do
            #     echo "第 ${i} 次发送 brief"
            #     action brief "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
            #     echo "task status: $status"
            #     if [ "$status" = "RUNNING" ]; then
            #         echo "任务已启动，状态为 RUNNING"
            #         break
            #     fi
            #     sleep "${BRIEF_INTERVAL}"
            # done
            sleep 200
        # 字面块标量（保留换行）
      # - name: Re Login 2
      #   # 字面块标量（保留换行）
      #   run: |
      #       set -e
      #       ./scripts/login.sh "$USER_NAME" "$PASS_WORD"
      #       # 从 secrets 初始化 OPENI_COOKIE（如果 secrets 过期，用 login.sh 更新）
      #       export OPENI_COOKIE="${{ secrets.OPENI_COOKIE }}"
      #       # 然后用 replace_csrf.sh 更新其中的 _csrf 和 i_like_openi
      #       export OPENI_COOKIE=$(./scripts/replace_csrf.sh)
      #       echo "OPENI_COOKIE=${OPENI_COOKIE}" >> $GITHUB_ENV
      - name: Get Next JOB_ID
        run: |
            set -euo pipefail
            JOB_ID=$(curl -s -G "https://openi.pcl.ac.cn/api/v1/${USER_NAME}/${REPO_NAME}/ai_task/list" \
                -H "Cookie: $OPENI_COOKIE" \
            | jq '.data.tasks | map(.task.id) | max')
            echo "JOB_ID=${JOB_ID}" >> $GITHUB_ENV
            echo "最大 task id: ${JOB_ID}"
      - name: Stop debug job
        run: |
            STATUS=$(curl -s -G "https://openi.pcl.ac.cn/api/v1/${USER_NAME}/${REPO_NAME}/ai_task/list" \
              -H "Cookie: $OPENI_COOKIE" | jq -r ".data.tasks[] | select(.id == $JOB_ID) | .status")
            echo "Task $JOB_ID status: $STATUS"
            if [ "$STATUS" != "RUNNING" ]; then
              echo "Error: Task not RUNNING, cannot stop."
              exit 1
            fi
            ./scripts/action.sh stop "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
