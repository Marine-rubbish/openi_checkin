name: Daily Debug

on:
  schedule:
    # 每天 12:00 UTC 触发（请根据你需要的本地时间换算）
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  run-debug:
    runs-on: ubuntu-latest
    env:
        USER_NAME: ${{ vars.USER_NAME }}        # 你的账户名称
        PASS_WORD: ${{ vars.PASS_WORD }}        # 你的账户密码
        REPO_NAME: ${{ vars.REPO_NAME }}        # 云脑环境对应的项目名称
        COOKIE: ${{ secrets.OPENI_COOKIE }}     # 你的cookie
        BRIEF_COUNT: 50                         # 发送 brief 的次数，按需修改
        BRIEF_INTERVAL: 10                      # 间隔秒数
    steps:
      # 检出仓库内文件
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix script permissions
        run: |
          chmod +x scripts/*.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          # 确保依赖存在
          if ! command -v jq >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else exit 1; fi
            fi
            # 兼容老镜像
            if grep -q "buster" /etc/os-release 2>/dev/null; then
              $SUDO sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
              $SUDO sed -i 's/security.debian.org/archive.debian.org/g' /etc/apt/sources.list
              $SUDO sed -i '/stretch-updates/d' /etc/apt/sources.list
            fi
            $SUDO apt-get update
            $SUDO apt-get install -y jq curl ca-certificates
          fi

      - name: Check Cookie Validity (Ensure Auth & CSRF)
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/workflow_api.sh

          HTTP_CODE="$(probe_my_list_http_code "$COOKIE")"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Cookie 或 CSRF 无效 (HTTP $HTTP_CODE)，启动自动登录续期..."
            UPDATED_COOKIE="$(renew_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            UPDATED_COOKIE="$(ensure_valid_cookie "$USER_NAME" "$PASS_WORD" "$UPDATED_COOKIE")"
            
            # 将新 Cookie 注入环境，供后面所有步骤使用
            echo "COOKIE=${UPDATED_COOKIE}" >> $GITHUB_ENV
            echo "Cookie 已更新并写入环境"
          else
            echo "当前 Cookie 和 CSRF 校验通过 (HTTP 200)"
            SAFE_COOKIE="$(ensure_valid_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            echo "COOKIE=${SAFE_COOKIE}" >> $GITHUB_ENV
          fi

      - name: Get JOB_ID
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/workflow_api.sh

          echo "[DEBUG] Get JOB_ID url=$(build_my_list_url "$COOKIE" 1 30)"

          resp="$(fetch_my_list "$COOKIE" 1 30 5 0)"
          debug_response "Get JOB_ID first" "$resp"

          # 非期望 JSON（例如 Invalid csrf token. 或 400 文本）则续期重试一次
          if ! is_tasks_json "$resp"; then
            echo "Get JOB_ID 首次请求异常，执行静默续期后重试..."
            COOKIE="$(renew_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            COOKIE="$(ensure_valid_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            echo "COOKIE=${COOKIE}" >> "$GITHUB_ENV"
            echo "[DEBUG] Get JOB_ID retry url=$(build_my_list_url "$COOKIE" 1 30)"
            resp="$(fetch_my_list "$COOKIE" 1 30 5 0)"
            debug_response "Get JOB_ID retry" "$resp"
          fi

          # 二次校验，确保后续 jq 安全
          assert_tasks_json "Get JOB_ID" "$resp"

          # 筛选当前项目的任务 ID
          JOB_ID="$(extract_max_job_id "$resp" "$REPO_NAME")"

          if [[ -z "${JOB_ID}" || "${JOB_ID}" == "null" ]]; then
            echo "未在响应中找到项目 ${REPO_NAME} 的任务，响应如下："
            echo "$resp" | jq .
            exit 1
          fi

          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "项目 ${REPO_NAME} 的最大 task id: ${JOB_ID}"
      - name: Start debug job
        run: |
          set -e
          ./scripts/action.sh restart "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
          # 确保一定是在RUNNING状态
          # for i in $(seq 1 "${BRIEF_COUNT}"); do
          #     echo "第 ${i} 次发送 brief"
          #     action brief "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
          #     echo "task status: $status"
          #     if [ "$status" = "RUNNING" ]; then
          #         echo "任务已启动，状态为 RUNNING"
          #         break
          #     fi
          #     sleep "${BRIEF_INTERVAL}"
          # done
          sleep 100
            
      - name: Get New JOB_ID after restart
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/workflow_api.sh

          echo "[DEBUG] Get New JOB_ID url=$(build_my_list_url "$COOKIE" 1 30)"

          resp="$(fetch_my_list "$COOKIE" 1 30 2 0)"
          debug_response "Get New JOB_ID first" "$resp"

          # 如果不是期望 JSON（例如 Invalid csrf token.），就续期再试一次
          if ! is_tasks_json "$resp"; then
            echo "检测到 CSRF/会话异常（可能返回纯文本），执行静默续期..."
            COOKIE="$(renew_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            COOKIE="$(ensure_valid_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            echo "COOKIE=${COOKIE}" >> "$GITHUB_ENV"
            echo "[DEBUG] Get New JOB_ID retry url=$(build_my_list_url "$COOKIE" 1 30)"
            resp="$(fetch_my_list "$COOKIE" 1 30 2 0)"
            debug_response "Get New JOB_ID retry" "$resp"
          fi

          # 二次校验，避免 jq 解析纯文本再次炸
          assert_tasks_json "Get New JOB_ID" "$resp"

          JOB_ID="$(extract_max_job_id "$resp" "$REPO_NAME")"

          if [[ -z "${JOB_ID}" || "${JOB_ID}" == "null" ]]; then
            echo "重启后未找到项目 ${REPO_NAME} 的新 JOB_ID"
            exit 1
          fi

          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "重启后的最新 task id: ${JOB_ID}"
      - name: Stop debug job
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/workflow_api.sh

          echo "[DEBUG] Stop debug job url=$(build_my_list_url "$COOKIE" 1 10)"

          resp="$(fetch_my_list "$COOKIE" 1 10 2 0)"
          debug_response "Stop debug job first" "$resp"

          # 非期望 JSON（例如 Invalid csrf token.）则续期重试一次
          if ! is_tasks_json "$resp"; then
            echo "检测到 CSRF/会话异常（可能返回纯文本），执行静默续期..."
            COOKIE="$(renew_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            COOKIE="$(ensure_valid_cookie "$USER_NAME" "$PASS_WORD" "$COOKIE")"
            echo "COOKIE=${COOKIE}" >> "$GITHUB_ENV"
            echo "[DEBUG] Stop debug job retry url=$(build_my_list_url "$COOKIE" 1 10)"
            resp="$(fetch_my_list "$COOKIE" 1 10 2 0)"
            debug_response "Stop debug job retry" "$resp"
          fi

          # 二次校验，确保后续 jq 安全
          assert_tasks_json "Stop debug job" "$resp"

          STATUS="$(extract_status_by_job_id "$resp" "$JOB_ID")"

          echo "Task $JOB_ID status: $STATUS"

          if [ -z "$STATUS" ]; then
            echo "未在列表中找到 task=$JOB_ID（可能列表未及时刷新或任务已消失）"
            exit 1
          fi

          if [ "$STATUS" != "RUNNING" ] && [ "$STATUS" != "WAITING" ]; then
            echo "Error: Task status is $STATUS, cannot stop."
            exit 1
          fi

          ./scripts/action.sh stop "$USER_NAME" "$REPO_NAME" "$JOB_ID" "$COOKIE"
